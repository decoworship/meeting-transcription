services:
  meeting-transcription:
    build:
      context: .
      dockerfile: Dockerfile
    image: meeting-transcription:latest
    container_name: meeting-transcription
    ports:
      - "7860:7860"
    environment:
      # HuggingFace token for diarization + voice fingerprinting models.
      # Set HF_TOKEN in a .env file next to this compose file or in your shell.
      HF_TOKEN: ${HF_TOKEN:-}
    volumes:
      # User data (config, history, projects, saved voices). Survives rebuilds.
      - ./data/meeting-transcription:/root/.meeting-transcription
      # Model cache — first run downloads ~5–10 GB; subsequent runs reuse.
      - ./data/huggingface:/root/.cache/huggingface
    # GPU passthrough — needs nvidia-container-toolkit on the host.
    # Comment out this whole `deploy:` block to run CPU-only.
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped
