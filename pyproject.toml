[project]
name = "meeting-transcription"
version = "0.1.0"
# O aplicativo é o `app-net/` (C#/WebView2). Este ambiente Python existe para
# duas coisas, e nenhuma delas é interface:
#   1. as sete ferramentas de medição em `tools/` — é como este projeto se mede;
#   2. o `src/` que elas importam, que continua sendo o oráculo dos números da
#      FASE0-RESULTADOS e a referência escrita dos formatos em disco.
# Os motores em `motores/` NÃO usam este ambiente: eles rodam no Python
# embarcado que vai junto com o app, no Windows.
description = "Ferramentas de medição e referência Python do Meeting Transcription (o app é app-net/)"
readme = "README.md"
requires-python = ">=3.13"
license = { file = "LICENSE" }
authors = [{ name = "decoworship" }]
dependencies = [
    # customtkinter e gradio saíram com as duas interfaces Python (13/08/2026).
    # openai-whisper e whisperx ficam: são as alternativas contra as quais a
    # FASE0 mediu o faster-whisper, e o src/transcription/__init__.py as importa.
    "ffmpeg-python>=0.2.0",
    "openai-whisper",
    "faster-whisper>=0.10.0",
    "pyannote-audio>=3.1.0",
    "torch>=2.0.0",
    "torchaudio>=2.0.0",
    "numpy>=1.24.0",
    "numba>=0.57.0",
    "python-dotenv>=1.0.0",
    "python-docx>=1.0.0",
    "whisperx",
    # O gerar_icone.py rasteriza o assets/logo.svg em cada tamanho de ícone.
    # Sem ele o script ainda roda, reduzindo o logo-256.png -- e o traço fino
    # da marca borra justamente nos 16 e 24 px.
    "cairosvg>=2.7.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
