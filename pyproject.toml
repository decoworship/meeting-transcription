[project]
name = "meeting-transcription"
version = "0.1.0"
description = "Web (Gradio) and desktop app for transcribing meeting recordings with speaker diarization and voice fingerprinting"
readme = "README.md"
requires-python = ">=3.13"
license = { file = "LICENSE" }
authors = [{ name = "decoworship" }]
dependencies = [
    "customtkinter>=5.2.0",
    "ffmpeg-python>=0.2.0",
    "gradio>=4.0.0",
    "openai-whisper",
    "faster-whisper>=0.10.0",
    "pyannote-audio>=3.1.0",
    "torch>=2.0.0",
    "torchaudio>=2.0.0",
    "numpy>=1.24.0",
    "numba>=0.57.0",
    "python-dotenv>=1.0.0",
    "python-docx>=1.0.0",
    "whisperx",
]

[project.scripts]
meeting-transcription = "main:main"
meeting-transcription-web = "web:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
