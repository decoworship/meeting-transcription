<?xml version="1.0" encoding="UTF-8"?>
<!-- A marca do PulseMeet: o monograma M dentro do círculo que já vinha do
     desenho anterior. Mesmo raio, mesma espessura de traço (23 no viewBox de
     496) — o que mudou foram as linhas de dentro.

     O vértice do meio não encosta na base de propósito: é o que impede o M de
     fechar num "W" invertido quando reduzido a 16 px, e é o mesmo recurso que
     o desenho anterior usava para não virar um "A" cheio.

     Quem gera os .ico a partir daqui é tools/gerar_icone.py. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 496 496"
     width="496" height="496">
  <g fill="none" stroke="#000000" stroke-width="23" stroke-linecap="butt">
    <circle cx="248" cy="248" r="236.5"/>
    <path d="M 120 380 L 120 130 L 248 296 L 376 130 L 376 380"/>
  </g>
</svg>
